name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradlew 的 git 权限位若是 100644，Linux runner 上会 Permission denied。
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Fabric + NeoForge
        run: ./gradlew build --stacktrace

      - name: Upload jars as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antipacketkick-jars
          if-no-files-found: error
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar

      # 推 tag（v*）时自动创建 Release 并把两个 jar 挂上去。
      - name: Publish jars to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
          generate_release_notes: true
